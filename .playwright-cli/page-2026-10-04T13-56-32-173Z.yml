        - paragraph [ref=f2e855]: "Most requests to a chatbot start with the same text: the hidden instructions (the system prompt) and the chat formatting. Their KV-cache notes come out identical every time, because each token’s notes depend only on the text before it. So servers keep those notes after a request ends and reuse them for the next request that starts the same way, skipping that part of prefill. This is prefix caching."
        - generic [ref=f2e856]:
          - paragraph [ref=f2e857]:
            - text: Notes are kept in blocks of 16 tokens. A block is reused only if it
            - emphasis [ref=f2e858]: and everything before it
            - text: match exactly. Change one word early on and every block after it has to be recomputed. That’s why production apps keep their system prompt identical, byte for byte.
          - paragraph [ref=f2e859]: "Try it: run a question, then press “Ask a different question”. Only the question changes, so the shared blocks are reused and the time to the first word drops. The default system prompt is short, so only one block can be shared. Switch to the longer one to see a bigger effect."
